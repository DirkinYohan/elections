server:
  port: 8080

spring:
  application:
    name: elections
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 64
          max-idle: 16
          min-idle: 4
          max-wait: 1000ms

logging:
  level:
    com.elections: DEBUG
    org.springframework.web: INFO
    org.springframework.data.redis: INFO
