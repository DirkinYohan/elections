# Balanceador local SIN afinidad (RT-2): round-robin puro entre las 8 instancias.
events { worker_connections 65535; }
http {
  upstream backend {
    server api1:8080; server api2:8080; server api3:8080; server api4:8080;
    server api5:8080; server api6:8080; server api7:8080; server api8:8080;
  }
  map $http_upgrade $connection_upgrade { default upgrade; '' ''; }
  server {
    listen 8080;
    location /api/v1/stream {
      proxy_pass http://backend; proxy_http_version 1.1; proxy_set_header Connection '';
      proxy_buffering off; proxy_read_timeout 1h;
    }
    location /ws/ {
      proxy_pass http://backend; proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 1h;
    }
    location / { proxy_pass http://backend; proxy_http_version 1.1; proxy_set_header Connection ''; }
  }
}
